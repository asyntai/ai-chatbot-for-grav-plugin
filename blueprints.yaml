name: Asyntai - AI Chatbot
slug: asyntai-ai-chatbot
type: plugin
version: 1.1.0
description: 'AI chatbot for your Grav site. Answers visitors day and night, from your own published pages.'
icon: comments
author:
  name: Asyntai
  email: hello@asyntai.com
  url: 'https://asyntai.com'
homepage: 'https://asyntai.com'
docs: 'https://asyntai.com/documentation/installation/grav/'
bugs: 'https://github.com/asyntai/ai-chatbot-for-grav-plugin/issues'
keywords: chatbot, ai, chat, support, assistant, live chat
license: MIT

compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    info:
      type: display
      size: large
      label: ' '
      markdown: true
      content: |
        Connect your site and choose what the chatbot may read on the **Asyntai AI Chatbot** page in the admin menu.
